<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Desenhar — Enseada</title>
    <meta name="theme-color" content="#F8F9FA">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icones/icone-192.png">
    <link rel="apple-touch-icon" href="icones/icone-192.png">
    <link rel="stylesheet" href="css/tema.css">
    <link rel="stylesheet" href="css/base.css">
    <script src="js/ancoras.js"></script>
    <script src="js/armazenamento.js"></script>
    <script src="js/ajustes.js"></script>
</head>
<body>
    <header class="topo-pagina">
        <h1>Espaço de Desenho</h1>
        <a href="index.html" class="link-voltar" aria-label="Voltar para a tela Agora">← Voltar</a>
    </header>

    <main class="conteudo-principal">
        <section class="secao-desenho">
            <p class="instrucao-suave">Um espaço livre e calmo para expressar traços sem pressa. O desenho fica guardado só neste aparelho.</p>

            <div class="painel-ferramentas">
                <div class="grupo-paleta" role="group" aria-label="Cores e borracha">
                    <button type="button" class="botao-cor ativa" data-cor="texto" aria-pressed="true"><span class="amostra" aria-hidden="true"></span>Verde profundo</button>
                    <button type="button" class="botao-cor" data-cor="destaque" aria-pressed="false"><span class="amostra" aria-hidden="true"></span>Azul turquesa</button>
                    <button type="button" class="botao-cor" data-cor="detalhe" aria-pressed="false"><span class="amostra" aria-hidden="true"></span>Verde-água</button>
                    <button type="button" class="botao-cor" data-cor="borracha" aria-pressed="false"><span class="amostra" aria-hidden="true"></span>Borracha</button>
                </div>
                <p class="explica" id="ferramenta-atual" role="status"></p>

                <div class="grupo-acoes">
                    <button type="button" id="btn-limpar" class="botao-secundario">Limpar tela</button>
                    <button type="button" id="btn-salvar" class="botao-primario">Guardar o desenho</button>
                </div>
                <p class="explica" id="recado-desenho" role="status"></p>
            </div>

            <div class="canvas-container">
                <canvas id="canvas-desenho" aria-label="Área de desenho livre. Use o dedo ou o mouse."></canvas>
            </div>
        </section>
    </main>

    <script src="js/tela-desenhar.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/registra-sw.js"></script>
</body>
</html>
